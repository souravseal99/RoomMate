name: Code Reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Architectural & Mentorship Review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute PR Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.DEFAULT_GEMINI_API_KEY }}
          PRIVATE_FE_GUIDELINES: ${{ secrets.PRIVATE_FE_GUIDELINES }}
          PRIVATE_BE_GUIDELINES: ${{ secrets.PRIVATE_BE_GUIDELINES }}
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              console.warn('⚠️ GEMINI_API_KEY secret is not set. Skipping automated AI review.');
              return;
            }

            // 1. Extract PR metadata and Git diff first
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No pull request payload found. Exiting.');
              return;
            }

            const baseRef = pr.base.ref;
            let diff = '';
            try {
              diff = execSync(`git diff origin/${baseRef}...HEAD`, { maxBuffer: 15 * 1024 * 1024 }).toString();
            } catch (err) {
              console.error('Error fetching git diff:', err.message);
              return;
            }

            if (!diff.trim()) {
              console.log('Diff is empty. Nothing to review.');
              return;
            }

            // 2. Read local project guidelines safely from filesystem with base branch fallback
            // If any file is not present in the PR branch or filesystem, fallback to baseRef (e.g. develop/main).
            // If completely absent, the reviewer smoothly continues using whatever guidelines are available.
            const readSafe = (filepath) => {
              if (fs.existsSync(filepath)) {
                return fs.readFileSync(filepath, 'utf8');
              }
              try {
                return execSync(`git show origin/${baseRef}:${filepath}`, { stdio: ['pipe', 'pipe', 'ignore'] }).toString();
              } catch {
                return '';
              }
            };

            const codeOfConduct = readSafe('CODE_OF_CONDUCT.md');
            const contributing = readSafe('CONTRIBUTING.md');
            const navGuidelines = readSafe('.agents/skills/roommate-navigation-and-theming.md');

            // Read private guidelines from GitHub Secrets first, fallback to filesystem if present
            const beGuidelines = (process.env.PRIVATE_BE_GUIDELINES || '').trim() || readSafe('.agents/skills/roommate-server-backend-guidelines.md');
            const feGuidelines = (process.env.PRIVATE_FE_GUIDELINES || '').trim() || readSafe('.agents/skills/roommate-app-frontend-guidelines.md');

            // Log discovered guidelines for transparency
            const loaded = [];
            if (codeOfConduct) loaded.push('CODE_OF_CONDUCT.md');
            if (contributing) loaded.push('CONTRIBUTING.md');
            if (beGuidelines) loaded.push(process.env.PRIVATE_BE_GUIDELINES ? 'Backend Guidelines (from Secret 🔒)' : 'Backend Guidelines (from File)');
            if (feGuidelines) loaded.push(process.env.PRIVATE_FE_GUIDELINES ? 'Frontend Guidelines (from Secret 🔒)' : 'Frontend Guidelines (from File)');
            if (navGuidelines) loaded.push('Theming Guidelines');
            console.log(`📋 Active guidelines for this review (${loaded.length}/5 loaded): ${loaded.join(', ') || 'General best practices'}`);

            // Truncate diff safely if extraordinarily large (preserving first 160KB)
            const maxDiffLength = 160000;
            const truncatedDiff = diff.length > maxDiffLength
              ? diff.slice(0, maxDiffLength) + '\n\n... [Diff truncated due to size limits] ...'
              : diff;

            // Assemble dynamically available guideline blocks
            const guidelineBlocks = [];
            if (contributing) guidelineBlocks.push(`[CONTRIBUTING.md Standards]:\n${contributing}`);
            if (beGuidelines) guidelineBlocks.push(`[Backend Architecture Guidelines]:\n${beGuidelines}`);
            if (feGuidelines) guidelineBlocks.push(`[Frontend Architecture & Styling Guidelines]:\n${feGuidelines}`);
            if (navGuidelines) guidelineBlocks.push(`[Theming & Navigation Guidelines]:\n${navGuidelines}`);

            const availableRulesText = guidelineBlocks.length > 0
              ? guidelineBlocks.join('\n\n')
              : 'Apply standard clean code, TypeScript, React, and Express/Fastify best practices.';

            // 3. Assemble the Lead Reviewer & Mentorship System Prompt
            const prompt = `You are a supportive, empathetic, and expert Senior Maintainer for the RoomMate Co-Living OS open-source project.
            Your role is to conduct a constructive, context-aware code review on this Pull Request.

            ===================================================================
            CRITICAL DIRECTIVE: CODE OF CONDUCT & MENTORSHIP
            ===================================================================
            You MUST follow the project's CODE OF CONDUCT at all times:
            ${codeOfConduct || 'Treat all contributors with empathy, respect, and constructive encouragement.'}

            Tone & Interaction Rules:
            1. EMPATHETIC & ENCOURAGING: Reviewing code is an act of mentorship. Always thank the contributor for their hard work and dedication.
            2. ZERO HARSHNESS / ZERO DISCOURAGEMENT: Never use dismissive, curt, condescending, or judgmental language (e.g. avoid "bad code", "sloppy", "breaks everything").
            3. PRAISE FIRST: Highlight at least 1-2 positive aspects of their contribution (clean logic, adherence to typing, great variable naming, clear intent, etc.).
            4. EXPLAIN THE "WHY": If suggesting a change, gently explain *why* it helps our co-living app (e.g., "To ensure the app looks seamless in both Dark and Light themes, we use semantic tokens like 'bg-card' rather than hardcoded hex codes").
            5. COLLABORATIVE & ACTIONABLE: Phrase suggestions as invitations ("Could we consider...", "What do you think about...", "A helpful improvement here would be..."). Provide copy-pasteable markdown suggestions wherever appropriate.

            ===================================================================
            PROJECT ARCHITECTURAL RULES TO VERIFY
            ===================================================================

            ${availableRulesText}

            Key Checklist Items to Check:
            - PR Title: Checks if it follows '<keyword>: (<branch-name>) <description in lowercase>' (per CONTRIBUTING.md).
            - Base Branch: Target branch should ideally be 'develop' (not 'main').
            - Frontend ('roommate-app'):
              * No modifications to 'src/components/ui/*' (shadcn primitives are strictly immutable; custom logic should wrap or extend via className).
              * Zero hardcoded hex colors (e.g. #fff, #1a1a1a); strictly use Tailwind v4 semantic tokens ('bg-surface', 'bg-card', 'text-primary', etc.).
              * Minimum 44px touch targets on interactive controls ('min-h-[44px]').
              * Use TanStack Query v5 for server data fetching (avoid unmanaged 'useEffect' data fetches).
            - Backend ('roommate-server'):
              * Strict 3-Tier Layering: Controllers -> Services -> Repositories.
              * Controllers must delegate DB calls to Services/Repos (never import Prisma directly in controllers).
              * Services must remain transport-agnostic (never import Express/Fastify Request/Response).
              * Household routes must be guarded by tenancy authorization.
              * Standardized ApiResponse format for responses and errors.

            ===================================================================
            PULL REQUEST UNDER REVIEW
            ===================================================================
            - PR Title: ${pr.title}
            - Author: @${pr.user.login}
            - Base Branch: ${baseRef}
            - Head Branch: ${pr.head.ref}

            [GIT DIFF]:
            ${truncatedDiff}

            ===================================================================
            OUTPUT FORMAT
            ===================================================================
            Format your review cleanly in GitHub Flavored Markdown:
            1. 👋 **Friendly Greeting & Appreciation**: A warm hello to @${pr.user.login} acknowledging their effort.
            2. 🌟 **What Looks Great**: Highlight specific strengths in the PR.
            3. 💡 **Constructive Architecture & Guideline Suggestions**:
               - Break down any items that need attention gently by file and line.
               - Provide ready-to-use markdown suggestions (using \`\`\`suggestion blocks when applicable).
            4. 🚀 **Next Steps / Approval Status**: A brief, encouraging wrap-up empowering the contributor to finalize their changes.`;

            // 4. Request Review from Gemini Flash API
            console.log('Calling Gemini 1.5 Flash for context-aware PR review...');
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: {
                    temperature: 0.2,
                    maxOutputTokens: 3000,
                  }
                })
              }
            );

            if (!response.ok) {
              const errBody = await response.text();
              console.error(`Gemini API error (Status ${response.status}):`, errBody);
              return;
            }

            const data = await response.json();
            const reviewComment = data?.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!reviewComment || !reviewComment.trim()) {
              console.warn('Gemini returned an empty review response.');
              return;
            }

            // 5. Post the review comment to the Pull Request
            console.log('Posting friendly architectural review to PR #' + pr.number);
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: reviewComment,
              event: 'COMMENT'
            });

            console.log('✅ Review successfully published.');
