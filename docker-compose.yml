services:
  client:
    build: ./roommate-app
    ports:
      - "5173:5173"
    environment:
      - SERVER_BASE_URL=http://localhost:5000
    volumes:
      - ./roommate-app:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    user: root
    build: ./roommate-server
    ports:
      - "5000:5000"
      - "5555:5555"
    volumes:
      - ./roommate-server:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - APP_PORT=5000
      - DATABASE_URL=postgresql://postgres:password@db:5432/roommate?schema=public
      - BCRYPT_SALT_ROUNDS=10
      - JWT_SECRET=dev_secret_key_roommate_2026
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=dev_refresh_secret_key_roommate_2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - USE_SECURE_COOKIE=false
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push && npm run db:seed && npm run dev:serve"

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roommate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d roommate" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

